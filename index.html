<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1351b4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coco Certo">
  <title>Coco Certo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <img class="logo" src="icone.svg" alt="">
      <div>
        <div class="nome">Coco Certo</div>
        <div id="data-hoje" class="data-hoje"></div>
      </div>
    </div>
  </header>

  <main id="conteudo" aria-live="polite"></main>

  <nav class="abas" aria-label="Menu">
    <button type="button" data-tela="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
      Início
    </button>
    <button type="button" data-tela="pedido">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 12.2h11.2L21.5 7H6"/></svg>
      Pedido
    </button>
    <button type="button" data-tela="relatorio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 21h18"/><rect x="5" y="11" width="3.5" height="7" rx="1"/><rect x="10.3" y="5" width="3.5" height="13" rx="1"/><rect x="15.6" y="8" width="3.5" height="10" rx="1"/></svg>
      Relatório
    </button>
    <button type="button" data-tela="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h9M18 6h2M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15.5" cy="6" r="2.3"/><circle cx="9" cy="12" r="2.3"/><circle cx="17" cy="18" r="2.3"/></svg>
      Ajustes
    </button>
  </nav>

  <input id="arquivo-copia" type="file" accept=".json,application/json" hidden>

  <script src="calculo.js"></script>
  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
